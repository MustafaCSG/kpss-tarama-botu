<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KPSS Tarih çıkmış soru bankası. Gerçek ÖSYM sınav soruları ile pratik yapın.">
  <title>KPSS Tarih — 📚 Çıkmış Sorular</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <span class="logo">📚</span>
        <span>KPSS <span class="text-gradient">Tarih</span></span>
      </a>
      <ul class="navbar-links">
        <li><a href="index.html">🏠 Ana Sayfa</a></li>
        <li><a href="quiz.html" class="active">📚 Çıkmış Sorular</a></li>
        <li><a href="ai_quiz.html" class="nav-link-ai">🤖 AI Özgün Sorular</a></li>
        <li><a href="wrong_notebook.html" style="color: #f87171;">📖 Yanlış Defterim</a></li>
        <li><a href="stats.html">📊 İstatistik</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="page">
    <div class="container">
      <!-- Filter Bar -->
      <div class="filter-bar" id="filter-bar">
        <div class="filter-group">
          <label class="filter-label">Konu</label>
          <select class="filter-select" id="filter-konu">
            <option value="">Tüm Konular</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Sınav Türü</label>
          <select class="filter-select" id="filter-sinav">
            <option value="">Tüm Sınavlar</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Yıl</label>
          <select class="filter-select" id="filter-yil">
            <option value="">Tüm Yıllar</option>
          </select>
        </div>
        <div class="filter-group" style="justify-content: flex-end;">
          <button class="btn btn-primary btn-sm" id="btn-apply-filter" style="margin-top: auto;">
            🔍 Filtrele
          </button>
        </div>
      </div>

      <!-- Quiz Container -->
      <div class="quiz-container" id="quiz-area">
        <div class="empty-state" id="quiz-loading">
          <div class="loading-spinner"></div>
          <p style="margin-top: 1rem;">Çıkmış sorular yükleniyor...</p>
        </div>
      </div>
    </div>

  <!-- Mobile Navigation -->
  <nav class="mobile-nav">
    <a href="index.html"><span class="icon">🏠</span><span>Ana Sayfa</span></a>

    <a href="stats.html"><span class="icon">📊</span><span>İstatistik</span></a>
  </nav>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/quiz.js"></script>
