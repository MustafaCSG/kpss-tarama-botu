name: Daily ÖSYM AI Question Generator & Auto-Deploy

on:
  schedule:
    # Her gün saat 06:00 UTC (TSİ 09:00) otomatik çalışır
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manuel çalıştırma butonu (GitHub Actions sekmesinden)

jobs:
  generate-questions:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate ÖSYM AI questions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node soru_uretici.js

      - name: Merge all questions
        run: python merge_all.py

      - name: Commit and push updated question datasets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Automated] Daily ÖSYM AI questions generated & merged"
          file_pattern: "uretilen_sorular.json sorular.json"
