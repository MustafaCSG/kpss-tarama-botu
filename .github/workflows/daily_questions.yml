name: Daily AI Question Generator

on:
  schedule:
    # Her sabah 06:00 UTC (TSİ 09:00) çalışır
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manuel çalıştırma butonu

jobs:
  generate-questions:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate 100 new AI questions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node soru_uretici.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Automated] Daily AI questions generated"
          file_pattern: "uretilen_sorular.json"
